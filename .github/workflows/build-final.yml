name: NGOMBI Final Cross-Platform Builds

on:
  workflow_dispatch:
  push:
    branches:
      - final-release

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  windows:
    name: Windows release
    runs-on: windows-2022
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NGOMBI-Windows-x64.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows-x64
          path: NGOMBI-Windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux release
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Linux
        run: flutter config --enable-linux-desktop
      - name: Generate Linux project
        run: flutter create --platforms=linux .
      - name: Get dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux
        run: tar -czf NGOMBI-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Linux-x64
          path: NGOMBI-Linux-x64.tar.gz
          if-no-files-found: error

  ios:
    name: iOS unsigned release
    runs-on: macos-15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios .
      - name: Configure iOS networking
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
      - name: Get dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app NGOMBI-iOS-unsigned.zip
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-iOS-unsigned
          path: NGOMBI-iOS-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS release
    runs-on: macos-15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate macOS project
        run: flutter create --platforms=macos .
      - name: Configure macOS networking
        run: |
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" macos/Runner/Release.entitlements || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" macos/Runner/DebugProfile.entitlements || true
      - name: Get dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ngombi.app NGOMBI-macOS.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-macOS
          path: NGOMBI-macOS.zip
          if-no-files-found: error

# Final validation pipeline: generated platform projects are built on native runners.
