name: NGOMBI Final - iOS

concurrency:
  group: ngombi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Generate platform project
        run: flutter create --platforms=ios .

      - name: Dependencies
        run: flutter pub get

      - name: Configure NGOMBI iOS identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          t = p.read_text()
          t = t.replace("com.example.ngombi", "com.ngombi.tv")
          p.write_text(t)
          info = Path("ios/Runner/Info.plist")
          if info.exists():
              t = info.read_text()
              t = t.replace("<string>Ngombi</string>", "<string>NGOMBI</string>")
              info.write_text(t)
          PY

      - name: Generate icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Remove generated Flutter example test
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned Xcode archive
        shell: bash
        run: |
          cd build/ios/archive
          zip -r ../../../NGOMBI-iOS-XcodeArchive.zip Runner.xcarchive

      - name: Upload unsigned Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-iOS-XcodeArchive
          path: NGOMBI-iOS-XcodeArchive.zip
          if-no-files-found: error
