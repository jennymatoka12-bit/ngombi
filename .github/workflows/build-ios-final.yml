name: NGOMBI Final - iOS

concurrency:
  group: ngombi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Generate platform project
        run: flutter create --platforms=ios .

      - name: Dependencies
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-iOS-Unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-iOS-Archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
