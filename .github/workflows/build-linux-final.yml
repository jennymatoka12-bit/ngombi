name: NGOMBI Final - Linux

on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Enable Linux
        run: flutter config --enable-linux-desktop

      - name: Doctor
        run: flutter doctor -v

      - name: Generate platform project
        run: flutter create --platforms=linux .

      - name: Dependencies
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: |
          cd build/linux/x64/release
          zip -r ../../../NGOMBI-Linux-Final.zip bundle

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Linux-Final
          path: build/NGOMBI-Linux-Final.zip
          if-no-files-found: error
