name: Build NGOMBI Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-mainline

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # MediaKit's current video controls use onPopInvokedWithResult,
          # which is unavailable in Flutter 3.22.3.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner files
        run: flutter create --platforms=windows .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Locate and verify Windows release
        shell: pwsh
        run: |
          $candidatePaths = @(
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          )
          $releasePath = $null
          foreach ($candidate in $candidatePaths) {
            if (Test-Path $candidate) {
              $releasePath = $candidate
              break
            }
          }
          if ($null -eq $releasePath) {
            Write-Host "Windows build output was not found. Existing build files:"
            Get-ChildItem -Path "build/windows" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 FullName
            throw "Windows release directory not found in either supported Flutter output layout."
          }
          $exe = Get-ChildItem -Path $releasePath -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            Get-ChildItem -Path $releasePath -Force
            throw "No executable was found in $releasePath."
          }
          Write-Host "Release directory: $releasePath"
          Write-Host "Executable: $($exe.Name)"
          "NGOMBI_RELEASE_PATH=$releasePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "NGOMBI_EXECUTABLE=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:NGOMBI_RELEASE_PATH/*" -DestinationPath "NGOMBI-Windows-Test.zip" -Force
          if (!(Test-Path "NGOMBI-Windows-Test.zip")) {
            throw "Windows ZIP package was not created."
          }
          Get-Item "NGOMBI-Windows-Test.zip" | Format-List Name, Length, FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows-Test
          path: NGOMBI-Windows-Test.zip
          if-no-files-found: error
