name: Build NGOMBI Windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-mainline
      - codex/windows-tv-webview-prototype
      - codex/windows-hls-sidecar-integration

jobs:
  verify-android-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter compatible with the current vlc_player dependency
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Resolve project dependencies
        run: flutter pub get

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner files
        run: flutter create --platforms=windows .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze lib
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Locate and verify Windows release
        shell: pwsh
        run: |
          $candidatePaths = @(
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          )
          $releasePath = $null
          foreach ($candidate in $candidatePaths) {
            if (Test-Path "$candidate/ngombi.exe") {
              $releasePath = $candidate
              break
            }
          }
          if ($null -eq $releasePath) {
            Write-Host "Windows executables found:"
            Get-ChildItem -Path "build/windows" -Filter "*.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName
            throw "ngombi.exe was not found in the expected Windows release directory."
          }
          $exe = Join-Path $releasePath "ngombi.exe"
          if (!(Test-Path $exe)) {
            throw "Required executable missing: $exe"
          }
          Write-Host "Verified executable: $exe"
          "NGOMBI_RELEASE_PATH=$releasePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Package Windows release and verify ZIP contents
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "ngombi-release-package"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path "$env:NGOMBI_RELEASE_PATH\*" -Destination $stage -Recurse -Force

          $stagedExe = Join-Path $stage "ngombi.exe"
          if (!(Test-Path $stagedExe)) {
            throw "Packaging aborted: ngombi.exe is not at the package root."
          }
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "NGOMBI-Windows-Test.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $exeEntry = $archive.Entries | Where-Object { $_.FullName -eq "ngombi.exe" } | Select-Object -First 1
            if ($null -eq $exeEntry) {
              throw "Packaging aborted: ZIP does not contain ngombi.exe at its root."
            }
            Write-Host "ZIP verified: root ngombi.exe exists; entries=$($archive.Entries.Count)"
          } finally {
            $archive.Dispose()
          }
          Get-Item $zipPath | Format-List Name, Length, FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows-Test
          path: NGOMBI-Windows-Test.zip
          if-no-files-found: error

  build-windows-tv-webview-poc:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: windows_tv_webview_poc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner files
        run: flutter create --platforms=windows .

      - name: Install prototype dependencies
        run: flutter pub get

      - name: Analyze prototype
        run: flutter analyze lib

      - name: Build prototype release
        run: flutter build windows --release

      - name: Upload prototype release
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows-WebView-HLS-Prototype
          path: windows_tv_webview_poc/build/windows/x64/runner/Release/
          if-no-files-found: error
