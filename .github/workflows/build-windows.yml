name: Build NGOMBI Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-mainline

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner files
        run: flutter create --platforms=windows .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $releasePath = "build/windows/x64/runner/Release"
          if (!(Test-Path "$releasePath/NGOMBI.exe")) {
            throw "NGOMBI.exe not found in the Windows release output."
          }
          Compress-Archive -Path "$releasePath/*" -DestinationPath "NGOMBI-Windows-Test.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows-Test
          path: NGOMBI-Windows-Test.zip
          if-no-files-found: error
