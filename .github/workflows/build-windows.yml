name: Build NGOMBI Windows

on:
  push:
    branches: [ngombi-final]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NGOMBI-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NGOMBI-Windows
          path: NGOMBI-Windows.zip
          if-no-files-found: error
