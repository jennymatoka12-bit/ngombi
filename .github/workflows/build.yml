name: Build NGOMBI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Recreate Android project
        run: flutter create . --platforms android

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------------------------
          # 1. MainActivity.java
          # -------------------------------------------------

          java_dir = Path(
              "android/app/src/main/java/com/example/ngombi"
          )

          java_dir.mkdir(parents=True, exist_ok=True)

          main_activity = java_dir / "MainActivity.java"

          main_activity.write_text(
              """package com.example.ngombi;

          import android.content.Intent;

          import androidx.annotation.NonNull;

          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;

          public class MainActivity extends FlutterActivity {

              private static final String CHANNEL = "ngombi/player";

              @Override
              public void configureFlutterEngine(
                      @NonNull FlutterEngine flutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine);

                  new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          CHANNEL
                  ).setMethodCallHandler((call, result) -> {

                      if ("playDash".equals(call.method)) {

                          String url = call.argument("url");
                          String userAgent = call.argument("userAgent");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL DASH manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  DashPlayerActivity.class
                          );

                          intent.putExtra("url", url);
                          intent.putExtra("userAgent", userAgent);

                          startActivity(intent);

                          result.success(true);

                      } else {
                          result.notImplemented();
                      }
                  });
              }
          }
          """
          )

          # Supprime le MainActivity Kotlin généré par Flutter.
          kotlin_activity = Path(
              "android/app/src/main/kotlin/com/example/ngombi/MainActivity.kt"
          )

          if kotlin_activity.exists():
              kotlin_activity.unlink()

          # -------------------------------------------------
          # 2. DashPlayerActivity.java
          # -------------------------------------------------

          dash_activity = java_dir / "DashPlayerActivity.java"

          dash_activity.write_text(
              """package com.example.ngombi;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;

          import androidx.annotation.Nullable;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.dash.DashMediaSource;
          import androidx.media3.exoplayer.source.MediaSource;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class DashPlayerActivity extends Activity {

              private ExoPlayer player;
              private PlayerView playerView;

              @Override
              protected void onCreate(
                      @Nullable Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  playerView = new PlayerView(this);

                  setContentView(playerView);

                  String url = getIntent().getStringExtra("url");
                  String userAgent =
                          getIntent().getStringExtra("userAgent");

                  if (url == null || url.isEmpty()) {
                      finish();
                      return;
                  }

                  if (userAgent == null || userAgent.isEmpty()) {
                      userAgent = "Mozilla/5.0";
                  }

                  DefaultHttpDataSource.Factory httpDataSourceFactory =
                          new DefaultHttpDataSource.Factory()
                                  .setUserAgent(userAgent);

                  MediaSource.Factory mediaSourceFactory =
                          new DashMediaSource.Factory(
                                  httpDataSourceFactory
                          );

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(mediaSourceFactory)
                          .build();

                  playerView.setPlayer(player);

                  MediaItem mediaItem =
                          new MediaItem.Builder()
                                  .setUri(Uri.parse(url))
                                  .setMimeType(MimeTypes.APPLICATION_MPD)
                                  .build();

                  player.setMediaItem(mediaItem);

                  player.prepare();
                  player.play();
              }

              @Override
              protected void onStop() {
                  super.onStop();

                  if (player != null) {
                      player.pause();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          """
          )

          # -------------------------------------------------
          # 3. AndroidManifest.xml
          # -------------------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          internet = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          network = (
              '    <uses-permission '
              'android:name="android.permission.ACCESS_NETWORK_STATE" />'
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  internet + "\n" +
                  network + "\n\n    <application",
                  1
              )

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          activity = """
          <activity
              android:name=".DashPlayerActivity"
              android:exported="false" />
          """

          if "DashPlayerActivity" not in text:
              text = text.replace(
                  "</application>",
                  activity + "\n    </application>",
                  1
              )

          manifest.write_text(text)

          # -------------------------------------------------
          # 4. Media3 dans app/build.gradle
          # -------------------------------------------------

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text()

          dependencies = """
          dependencies {
              implementation "androidx.media3:media3-exoplayer:1.11.1"
              implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
              implementation "androidx.media3:media3-ui:1.11.1"
          }

          """

          if "androidx.media3:media3-exoplayer:1.11.1" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "android {",
                  dependencies + "android {",
                  1
              )

          gradle.write_text(gradle_text)

          print("Android NGOMBI configure avec succes.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean Flutter project
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
