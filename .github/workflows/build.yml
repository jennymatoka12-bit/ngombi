name: Build & Release NGOMBI Direct APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Java 17 (Requis pour Gradle 7/8 et just_audio)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Configuration de Flutter (Version stable 3.x)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 4. Vérification de l'état de Flutter
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Téléchargement des dépendances du projet
      - name: Install dependencies
        run: flutter pub get

      # 6. Génération automatique de l'icône de l'application à partir de assets/icon/icon.png
      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      # 7. Analyse statique du code Dart
      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      # 8. Compilation de l'APK Release optimisé par architecture (ARM64, ARMv7, x86_64)
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 9. Publication et sauvegarde des fichiers APK dans les Artifacts GitHub
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-direct-apks
          path: build/app/outputs/flutter-apk/*.apk
