name: Build NGOMBI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      # --------------------------------------------------
      # Recreate Android project
      # --------------------------------------------------

      - name: Recreate Android project
        run: flutter create . --platforms android

      # --------------------------------------------------
      # Configure NGOMBI Android
      # --------------------------------------------------

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==================================================
          # MainActivity.java
          # ==================================================

          java_dir = Path(
              "android/app/src/main/java/com/example/ngombi"
          )

          java_dir.mkdir(parents=True, exist_ok=True)

          main_activity = java_dir / "MainActivity.java"

          main_activity.write_text(
              """package com.example.ngombi;

          import android.content.Intent;

          import androidx.annotation.NonNull;

          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;

          public class MainActivity extends FlutterActivity {

              private static final String CHANNEL = "ngombi/player";

              @Override
              public void configureFlutterEngine(
                      @NonNull FlutterEngine flutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine);

                  new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          CHANNEL
                  ).setMethodCallHandler((call, result) -> {

                      if ("playDash".equals(call.method)) {

                          String url = call.argument("url");
                          String userAgent = call.argument("userAgent");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL DASH manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  DashPlayerActivity.class
                          );

                          intent.putExtra("url", url);
                          intent.putExtra("userAgent", userAgent);

                          startActivity(intent);

                          result.success(true);

                      } else {
                          result.notImplemented();
                      }
                  });
              }
          }
          """
          )

          kotlin_activity = Path(
              "android/app/src/main/kotlin/com/example/ngombi/MainActivity.kt"
          )

          if kotlin_activity.exists():
              kotlin_activity.unlink()

          # ==================================================
          # DashPlayerActivity.java
          # ==================================================

          dash_activity = java_dir / "DashPlayerActivity.java"

          dash_activity.write_text(
              """package com.example.ngombi;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;

          import androidx.annotation.Nullable;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.dash.DashMediaSource;
          import androidx.media3.exoplayer.source.MediaSource;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class DashPlayerActivity extends Activity {

              private ExoPlayer player;
              private PlayerView playerView;

              @Override
              protected void onCreate(
                      @Nullable Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  playerView = new PlayerView(this);

                  setContentView(playerView);

                  String url =
                          getIntent().getStringExtra("url");

                  String userAgent =
                          getIntent().getStringExtra("userAgent");

                  if (url == null || url.isEmpty()) {
                      finish();
                      return;
                  }

                  if (userAgent == null || userAgent.isEmpty()) {
                      userAgent = "Mozilla/5.0";
                  }

                  DefaultHttpDataSource.Factory
                          httpDataSourceFactory =
                          new DefaultHttpDataSource.Factory()
                                  .setUserAgent(userAgent);

                  MediaSource.Factory mediaSourceFactory =
                          new DashMediaSource.Factory(
                                  httpDataSourceFactory
                          );

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(
                                  mediaSourceFactory
                          )
                          .build();

                  playerView.setPlayer(player);

                  MediaItem mediaItem =
                          new MediaItem.Builder()
                                  .setUri(Uri.parse(url))
                                  .setMimeType(
                                          MimeTypes.APPLICATION_MPD
                                  )
                                  .build();

                  player.setMediaItem(mediaItem);

                  player.prepare();
                  player.play();
              }

              @Override
              protected void onStop() {
                  super.onStop();

                  if (player != null) {
                      player.pause();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          """
          )

          # ==================================================
          # AndroidManifest.xml
          # ==================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          internet_permission = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          network_permission = (
              '    <uses-permission '
              'android:name="android.permission.ACCESS_NETWORK_STATE" />'
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  internet_permission
                  + "\n\n    <application",
                  1
              )

          if "android.permission.ACCESS_NETWORK_STATE" not in text:
              text = text.replace(
                  "<application",
                  network_permission
                  + "\n\n    <application",
                  1
              )

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          dash_activity_declaration = """
              <activity
                  android:name=".DashPlayerActivity"
                  android:exported="false" />
          """

          if "DashPlayerActivity" not in text:
              text = text.replace(
                  "</application>",
                  dash_activity_declaration
                  + "\n    </application>",
                  1
              )

          manifest.write_text(text)

          # ==================================================
          # app/build.gradle
          # ==================================================

          app_gradle = Path(
              "android/app/build.gradle"
          )

          gradle_text = app_gradle.read_text()

          media3_dependencies = """
          dependencies {
              implementation "androidx.media3:media3-exoplayer:1.11.1"
              implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
              implementation "androidx.media3:media3-ui:1.11.1"
          }

          """

          if "androidx.media3:media3-exoplayer:1.11.1" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "android {",
                  media3_dependencies + "android {",
                  1
              )

          # Media3 1.11.1 nécessite au minimum Android 6.0 / API 23.
          gradle_text = re.sub(
              r"minSdk\s*=\s*flutter\.minSdkVersion",
              "minSdk = 23",
              gradle_text
          )

          gradle_text = re.sub(
              r"minSdk\s*=\s*\d+",
              "minSdk = 23",
              gradle_text
          )

          # Media3 1.11.1 nécessite compileSdk 36.
          gradle_text = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              gradle_text
          )

          if "ndkVersion" in gradle_text:
              gradle_text = re.sub(
                  r'ndkVersion\s*=\s*[^\\n]+',
                  'ndkVersion = "27.0.12077973"',
                  gradle_text
              )
          else:
              gradle_text = gradle_text.replace(
                  "compileSdk = 36",
                  'compileSdk = 36\n    ndkVersion = "27.0.12077973"',
                  1
              )

          app_gradle.write_text(gradle_text)

          print("NGOMBI Android configuration completed.")
          PY

      # --------------------------------------------------
      # Upgrade Android build tools
      # --------------------------------------------------

      - name: Upgrade Android build tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==================================================
          # settings.gradle
          # ==================================================

          settings = Path(
              "android/settings.gradle"
          )

          text = settings.read_text()

          text = re.sub(
              r'id "com\.android\.application" version "[^"]+" apply false',
              'id "com.android.application" version "8.10.0" apply false',
              text
          )

          text = re.sub(
              r'id "org\.jetbrains\.kotlin\.android" version "[^"]+" apply false',
              'id "org.jetbrains.kotlin.android" version "2.2.0" apply false',
              text
          )

          settings.write_text(text)

          # ==================================================
          # Gradle wrapper
          # ==================================================

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          text = wrapper.read_text()

          text = re.sub(
              r"distributionUrl=.*",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip",
              text
          )

          wrapper.write_text(text)

          print("Android Gradle Plugin: 8.10.0")
          print("Gradle: 8.11.1")
          print("Compile SDK: 36")
          print("Min SDK: 23")
          print("NDK: 27.0.12077973")
          print("Kotlin: 2.2.0")
          PY

      # --------------------------------------------------
      # Verify Android configuration
      # --------------------------------------------------

      - name: Verify Android configuration
        run: |
          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo ""
          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo ""
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== MainActivity.java ====="
          cat android/app/src/main/java/com/example/ngombi/MainActivity.java

          echo ""
          echo "===== DashPlayerActivity.java ====="
          cat android/app/src/main/java/com/example/ngombi/DashPlayerActivity.java

          echo ""
          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      # --------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------

      - name: Get Flutter dependencies
        run: flutter pub get

      # --------------------------------------------------
      # Clean
      # --------------------------------------------------

      - name: Clean Flutter project
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      # --------------------------------------------------
      # Remove default test
      # --------------------------------------------------

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      # --------------------------------------------------
      # Analyze
      # --------------------------------------------------

      - name: Analyze Flutter project
        run: flutter analyze

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
