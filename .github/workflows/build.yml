name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Clean old Android files
        run: rm -rf android

      - name: Rebuild fresh Android project structure
        run: flutter create . --platforms android --org com.ngombi.app

      - name: Add Internet Permission
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          path = 'android/app/src/main/AndroidManifest.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          
          perm_name = 'android.permission.INTERNET'
          has_perm = any(elem.attrib.get('{http://schemas.android.com/apk/res/android}name') == perm_name for elem in root.findall('uses-permission'))
          
          if not has_perm:
              perm_elem = ET.Element('uses-permission', {'android:name': perm_name})
              root.insert(0, perm_elem)
              tree.write(path, encoding='utf-8', xml_declaration=True)
          "

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
