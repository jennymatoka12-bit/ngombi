name: Build & Release NGOMBI Direct APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Java 17 (Nécessaire pour les versions récentes de Gradle et just_audio)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Configuration de l'environnement Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Utilise la version stable 3.x
          channel: 'stable'
          cache: true

      # 4. Vérification de l'environnement
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Installation des nouvelles dépendances (just_audio, youtube_player_flutter, etc.)
      - name: Install dependencies
        run: flutter pub get

      # 6. Analyse syntaxique du code
      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      # 7. Compilation de l'APK Release (APK Universel)
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 8. Sauvegarde des fichiers APK générés dans les Artifacts GitHub
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-direct-apks
          path: build/app/outputs/flutter-apk/*.apk
