name: Build NGOMBI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics
        

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          internet = '    <uses-permission android:name="android.permission.INTERNET" />'
          network = '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  '<application',
                  internet + "\n" + network + "\n\n    <application",
                  1
              )

          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application ',
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          path.write_text(text)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean Flutter project
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get
        
      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
