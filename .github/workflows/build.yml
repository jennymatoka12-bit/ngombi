name: Build NGOMBI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      # --------------------------------------------------
      # Recreate Android project
      # --------------------------------------------------

      - name: Recreate Android project
        run: flutter create . --platforms android

      # --------------------------------------------------
      # Configure NGOMBI Android
      # --------------------------------------------------

      - name: Configure Android project
        shell: bash
        run: |
          set -e

          JAVA_DIR="android/app/src/main/java/com/example/ngombi"
          KOTLIN_FILE="android/app/src/main/kotlin/com/example/ngombi/MainActivity.kt"

          mkdir -p "$JAVA_DIR"

          # ==================================================
          # MainActivity.java
          # ==================================================

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package com.example.ngombi;

          import android.content.Intent;

          import androidx.annotation.NonNull;
          import androidx.core.content.ContextCompat;

          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;

          public class MainActivity extends FlutterActivity {

              private static final String PLAYER_CHANNEL = "ngombi/player";
              private static final String RADIO_CHANNEL = "ngombi/radio";

              @Override
              public void configureFlutterEngine(
                      @NonNull FlutterEngine flutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine);

                  new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          PLAYER_CHANNEL
                  ).setMethodCallHandler((call, result) -> {

                      if ("playDash".equals(call.method)) {
                          String url = call.argument("url");
                          String userAgent = call.argument("userAgent");
                          String channelName = call.argument("channelName");
                          String programTitle = call.argument("programTitle");
                          Long programStartMs = call.argument("programStartMs");
                          Long programEndMs = call.argument("programEndMs");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL DASH manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  DashPlayerActivity.class
                          );

                          intent.putExtra("url", url);
                          intent.putExtra("userAgent", userAgent);
                          intent.putExtra("channelName", channelName);
                          intent.putExtra("programTitle", programTitle);

                          if (programStartMs != null) {
                              intent.putExtra(
                                      "programStartMs",
                                      programStartMs.longValue()
                              );
                          }

                          if (programEndMs != null) {
                              intent.putExtra(
                                      "programEndMs",
                                      programEndMs.longValue()
                              );
                          }

                          startActivity(intent);
                          result.success(true);
                          return;
                      }

                      result.notImplemented();
                  });

                  new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          RADIO_CHANNEL
                  ).setMethodCallHandler((call, result) -> {

                      if ("startBackgroundRadio".equals(call.method)) {
                          String url = call.argument("url");
                          String title = call.argument("title");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL audio manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioPlaybackService.class
                          );

                          intent.setAction(
                                  RadioPlaybackService.ACTION_PLAY_RADIO
                          );
                          intent.putExtra(
                                  RadioPlaybackService.EXTRA_URL,
                                  url
                          );
                          intent.putExtra(
                                  RadioPlaybackService.EXTRA_TITLE,
                                  title == null ? "NGOMBI Radio" : title
                          );

                          ContextCompat.startForegroundService(
                                  MainActivity.this,
                                  intent
                          );

                          result.success(true);
                          return;
                      }

                      if ("stopBackgroundRadio".equals(call.method)) {
                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioPlaybackService.class
                          );

                          intent.setAction(
                                  RadioPlaybackService.ACTION_STOP_RADIO
                          );

                          startService(intent);
                          result.success(true);
                          return;
                      }

                      result.notImplemented();
                  });
              }
          }
          EOF

          # Supprimer le MainActivity Kotlin généré par Flutter.
          rm -f "$KOTLIN_FILE"

          # ==================================================
          # DashPlayerActivity.java
          # ==================================================

          cat > "$JAVA_DIR/DashPlayerActivity.java" <<'EOF'
          package com.example.ngombi;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import androidx.annotation.Nullable;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class DashPlayerActivity extends Activity {

              private ExoPlayer player;
              private PlayerView playerView;
              private TextView errorText;
              private boolean initialLandscape;

              @Override
              protected void onCreate(
                      @Nullable Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  initialLandscape =
                          getResources().getConfiguration().orientation
                                  == Configuration.ORIENTATION_LANDSCAPE;

                  FrameLayout root = new FrameLayout(this);

                  playerView = new PlayerView(this);

                  root.addView(
                          playerView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  LinearLayoutOverlay:
                  {
                      Button orientationButton = new Button(this);
                      orientationButton.setText(
                              initialLandscape ? "PORTRAIT" : "PAYSAGE"
                      );

                      orientationButton.setOnClickListener(
                              view -> {
                                  boolean landscape =
                                          getResources()
                                                  .getConfiguration()
                                                  .orientation
                                                  == Configuration.ORIENTATION_LANDSCAPE;

                                  setRequestedOrientation(
                                          landscape
                                                  ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                                                  : ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                                  );

                                  orientationButton.setText(
                                          landscape ? "PAYSAGE" : "PORTRAIT"
                                  );
                              }
                      );

                      FrameLayout.LayoutParams buttonParams =
                              new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              );
                      buttonParams.gravity =
                              android.view.Gravity.TOP |
                              android.view.Gravity.END;
                      buttonParams.topMargin = 18;
                      buttonParams.rightMargin = 18;

                      root.addView(
                              orientationButton,
                              buttonParams
                      );

                      TextView programText = new TextView(this);
                      String channelName =
                              getIntent().getStringExtra("channelName");
                      String programTitle =
                              getIntent().getStringExtra("programTitle");

                      String displayTitle =
                              channelName == null || channelName.isEmpty()
                                      ? "NGOMBI TV"
                                      : channelName;

                      if (programTitle != null &&
                              !programTitle.isEmpty()) {
                          displayTitle += "\n" + programTitle;
                      }

                      programText.setText(displayTitle);
                      programText.setTextColor(0xFFFFFFFF);
                      programText.setTextSize(15);
                      programText.setPadding(20, 12, 20, 12);
                      programText.setBackgroundColor(0x88000000);

                      FrameLayout.LayoutParams titleParams =
                              new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              );
                      titleParams.gravity =
                              android.view.Gravity.TOP |
                              android.view.Gravity.START;
                      titleParams.topMargin = 18;
                      titleParams.leftMargin = 18;

                      root.addView(
                              programText,
                              titleParams
                      );
                  }

                  errorText = new TextView(this);

                  errorText.setTextColor(0xFFFFFFFF);
                  errorText.setTextSize(15);
                  errorText.setPadding(40, 40, 40, 40);
                  errorText.setVisibility(TextView.GONE);

                  root.addView(
                          errorText,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  setContentView(root);

                  String url =
                          getIntent().getStringExtra("url");

                  String userAgent =
                          getIntent().getStringExtra("userAgent");

                  if (url == null || url.isEmpty()) {
                      showError("URL DASH manquante.");
                      return;
                  }

                  if (userAgent == null || userAgent.isEmpty()) {
                      userAgent = "Mozilla/5.0";
                  }

                  DefaultHttpDataSource.Factory
                          httpDataSourceFactory =
                          new DefaultHttpDataSource.Factory()
                                  .setUserAgent(userAgent);

                  /*
                   * Configuration Widevine officielle.
                   *
                   * NGOMBI ne contourne aucun DRM :
                   * Media3 utilise le mécanisme DRM Android
                   * prévu par le flux.
                   */
                  MediaItem.DrmConfiguration
                          drmConfiguration =
                          new MediaItem.DrmConfiguration.Builder(
                                  C.WIDEVINE_UUID
                          )
                                  .setMultiSession(true)
                                  .build();

                  MediaItem mediaItem =
                          new MediaItem.Builder()
                                  .setUri(url)
                                  .setMimeType("application/dash+xml")
                                  .setDrmConfiguration(
                                          drmConfiguration
                                  )
                                  .build();

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(
                                  new DefaultMediaSourceFactory(
                                          httpDataSourceFactory
                                  )
                          )
                          .build();

                  playerView.setPlayer(player);

                  player.addListener(
                          new Player.Listener() {

                              @Override
                              public void onPlayerError(
                                      PlaybackException error
                              ) {
                                  showError(
                                          "Erreur DRM / lecture :\n\n"
                                          + error.getErrorCodeName()
                                          + "\n\n"
                                          + error.getMessage()
                                  );
                              }
                          }
                  );

                  player.setMediaItem(mediaItem);

                  player.prepare();
                  player.play();
              }

              private void showError(String message) {
                  if (errorText != null) {
                      errorText.setText(message);
                      errorText.setVisibility(TextView.VISIBLE);
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();

                  if (player != null) {
                      player.pause();
                  }
              }

              @Override
              protected void onDestroy() {
                  setRequestedOrientation(
                          initialLandscape
                                  ? ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                                  : ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  );

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          # ==================================================
          # RadioPlaybackService.java
          # ==================================================

          cat > "$JAVA_DIR/RadioPlaybackService.java" <<'EOF'
          package com.example.ngombi;

          import android.content.Intent;

          import androidx.annotation.Nullable;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.audio.AudioAttributes;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;

          @UnstableApi
          public class RadioPlaybackService extends MediaSessionService {

              public static final String ACTION_PLAY_RADIO =
                      "com.example.ngombi.action.PLAY_RADIO";

              public static final String ACTION_STOP_RADIO =
                      "com.example.ngombi.action.STOP_RADIO";

              public static final String EXTRA_URL =
                      "com.example.ngombi.extra.URL";

              public static final String EXTRA_TITLE =
                      "com.example.ngombi.extra.TITLE";

              private ExoPlayer player;
              private MediaSession mediaSession;

              @Override
              public void onCreate() {
                  super.onCreate();

                  AudioAttributes audioAttributes =
                          new AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(
                                          C.AUDIO_CONTENT_TYPE_MUSIC
                                  )
                                  .build();

                  player = new ExoPlayer.Builder(this).build();
                  player.setAudioAttributes(
                          audioAttributes,
                          true
                  );

                  mediaSession =
                          new MediaSession.Builder(
                                  this,
                                  player
                          ).build();
              }

              @Override
              public int onStartCommand(
                      @Nullable Intent intent,
                      int flags,
                      int startId
              ) {
                  if (intent != null) {
                      String action = intent.getAction();

                      if (ACTION_STOP_RADIO.equals(action)) {
                          player.stop();
                          player.clearMediaItems();
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      if (ACTION_PLAY_RADIO.equals(action)) {
                          String url =
                                  intent.getStringExtra(EXTRA_URL);

                          String title =
                                  intent.getStringExtra(EXTRA_TITLE);

                          if (url != null && !url.isEmpty()) {
                              MediaMetadata metadata =
                                      new MediaMetadata.Builder()
                                              .setTitle(
                                                      title == null ||
                                                              title.isEmpty()
                                                              ? "NGOMBI Radio"
                                                              : title
                                              )
                                              .setArtist("NGOMBI")
                                              .build();

                              MediaItem mediaItem =
                                      new MediaItem.Builder()
                                              .setUri(url)
                                              .setMediaMetadata(
                                                      metadata
                                              )
                                              .build();

                              player.setMediaItem(mediaItem);
                              player.prepare();
                              player.play();
                          }
                      }
                  }

                  return START_STICKY;
              }

              @Override
              public MediaSession onGetSession(
                      MediaSession.ControllerInfo controllerInfo
              ) {
                  return mediaSession;
              }

              @Override
              public void onDestroy() {
                  if (mediaSession != null) {
                      mediaSession.release();
                      mediaSession = null;
                  }

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          # ==================================================
          # AndroidManifest.xml
          # ==================================================

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application',
                  1
              )

          if "android.permission.FOREGROUND_SERVICE" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n\n    <application',
                  1
              )

          if "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n\n    <application',
                  1
              )

          if "android.permission.ACCESS_NETWORK_STATE" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application',
                  1
              )

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          if "DashPlayerActivity" not in text:
              activity = (
                  '        <activity\n'
                  '            android:name=".DashPlayerActivity"\n'
                  '            android:configChanges="orientation|screenSize|keyboardHidden"\n'
                  '            android:exported="false" />\n\n'
              )

              text = text.replace(
                  "</application>",
                  activity + "</application>",
                  1
              )

          if "RadioPlaybackService" not in text:
              service = (
                  '        <service\n'
                  '            android:name=".RadioPlaybackService"\n'
                  '            android:foregroundServiceType="mediaPlayback"\n'
                  '            android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="androidx.media3.session.MediaSessionService" />\n'
                  '                <action android:name="android.media.browse.MediaBrowserService" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n\n'
              )

              text = text.replace(
                  "</application>",
                  service + "</application>",
                  1
              )

          manifest.write_text(text)
          PY

          # ==================================================
          # app/build.gradle
          # ==================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # Compile SDK
          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          # Min SDK
          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = re.sub(
              r"minSdk\s*=\s*\d+",
              "minSdk = 23",
              text
          )

          # NDK
          text = re.sub(
              r"^\s*ndkVersion\s*=.*$",
              "",
              text,
              flags=re.MULTILINE
          )

          text = text.replace(
              "compileSdk = 36",
              'compileSdk = 36\n    ndkVersion = "27.0.12077973"',
              1
          )

          # Media3 dependencies
          if "androidx.media3:media3-exoplayer:1.11.1" not in text:
              dependencies = (
                  "\n"
                  "dependencies {\n"
                  '    implementation "androidx.media3:media3-exoplayer:1.11.1"\n'
                  '    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"\n'
                  '    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"\n'
                  "}\n"
              )

              text += dependencies

          gradle.write_text(text)

          print("Android app configuration completed.")
          PY

      # --------------------------------------------------
      # Android Gradle Plugin / Gradle
      # --------------------------------------------------

      - name: Upgrade Android build tools
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==================================================
          # settings.gradle
          # ==================================================

          settings = Path("android/settings.gradle")
          text = settings.read_text()

          text = re.sub(
              r'id "com\.android\.application" version "[^"]+" apply false',
              'id "com.android.application" version "8.10.0" apply false',
              text
          )

          text = re.sub(
              r'id "org\.jetbrains\.kotlin\.android" version "[^"]+" apply false',
              'id "org.jetbrains.kotlin.android" version "2.2.0" apply false',
              text
          )

          settings.write_text(text)

          # ==================================================
          # Gradle wrapper
          # ==================================================

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          text = wrapper.read_text()

          text = re.sub(
              r"distributionUrl=.*",
              r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip",
              text
          )

          wrapper.write_text(text)

          print("Android Gradle Plugin: 8.10.0")
          print("Gradle: 8.11.1")
          print("Compile SDK: 36")
          print("Min SDK: 23")
          print("NDK: 27.0.12077973")
          print("Kotlin: 2.2.0")
          PY

      # --------------------------------------------------
      # Flutter dependencies
      # --------------------------------------------------

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean Flutter project
        run: flutter clean

      - name: Get Flutter dependencies again
        run: flutter pub get

      # --------------------------------------------------
      # Generate NGOMBI launcher icon
      # --------------------------------------------------

      - name: Generate NGOMBI launcher icon
        run: dart run flutter_launcher_icons

      # --------------------------------------------------
      # Force NGOMBI launcher icon in Android manifest
      # --------------------------------------------------

      - name: Configure NGOMBI launcher icon
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/launcher_icon"'
          )

          manifest.write_text(text)
          PY

          echo "===== Launcher icon manifest ====="
          grep 'android:icon=' "$MANIFEST"

      # --------------------------------------------------
      # Verify launcher icon
      # --------------------------------------------------

      - name: Verify NGOMBI launcher icon
        shell: bash
        run: |
          set -e

          echo "===== Launcher resources ====="

          find android/app/src/main/res \
            -type f \
            \( -name "launcher_icon*" -o -name "ic_launcher*" \) \
            -print

          echo ""
          echo "===== Manifest icon ====="

          grep 'android:icon=' \
            android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== NGOMBI asset ====="

          test -f assets/ngombi_icon.png

          ls -lh assets/ngombi_icon.png

      # --------------------------------------------------
      # Remove default Flutter test
      # --------------------------------------------------

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      # --------------------------------------------------
      # Analyze Flutter project
      # --------------------------------------------------

      - name: Analyze Flutter project
        run: flutter analyze

      # --------------------------------------------------
      # Build release APK
      # --------------------------------------------------

      - name: Build release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
