name: Build & Release NGOMBI Direct APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Java 17 (Action v5)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configuration de Flutter (Version stable 3.x)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 4. Vérification de l'environnement Flutter
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Téléchargement des dépendances du projet
      - name: Install dependencies
        run: flutter pub get

      # 6. Génération sécurisée des icônes d'application
      - name: Generate Launcher Icons
        run: |
          if [ -f "assets/icon/icon.png" ]; then
            flutter pub run flutter_launcher_icons
          else
            echo "Icon file not found in assets/icon/icon.png, skipping icon generation."
          fi

      # 7. Analyse du code Dart
      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      # 8. Compilation de l'APK Release optimisé par architecture
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 9. Sauvegarde des fichiers APK générés dans les Artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-direct-apks
          path: build/app/outputs/flutter-apk/*.apk
