name: Build NGOMBI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      # --------------------------------------------------
      # Recreate Android project
      # --------------------------------------------------

      - name: Recreate Android project
        run: flutter create . --platforms android

      # --------------------------------------------------
      # Configure NGOMBI Android
      # --------------------------------------------------

      - name: Configure Android project
        shell: bash
        run: |
          set -e

          JAVA_DIR="android/app/src/main/java/com/example/ngombi"
          KOTLIN_FILE="android/app/src/main/kotlin/com/example/ngombi/MainActivity.kt"

          mkdir -p "$JAVA_DIR"

          # ==================================================
          # MainActivity.java
          # ==================================================

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package com.example.ngombi;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Bundle;

          import androidx.annotation.NonNull;
          import androidx.core.content.ContextCompat;

          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;

          public class MainActivity extends FlutterActivity {

              private static final String PLAYER_CHANNEL = "ngombi/player";
              private static final String RADIO_CHANNEL = "ngombi/radio";
              private static final String RADIO_CONTROL_ACTION = "com.example.ngombi.RADIO_CONTROL";
              private MethodChannel radioChannel;
              private boolean radioReceiverRegistered = false;

              private final BroadcastReceiver radioControlReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (radioChannel != null && intent != null) {
                          radioChannel.invokeMethod(
                                  "radioNotificationControl",
                                  intent.getStringExtra("control")
                          );
                      }
                  }
              };

              @Override
              public void configureFlutterEngine(
                      @NonNull FlutterEngine flutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine);

                  new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          PLAYER_CHANNEL
                  ).setMethodCallHandler((call, result) -> {

                      if ("setKeepScreenOn".equals(call.method)) {
                          Boolean enabled = call.argument("enabled");

                          if (Boolean.TRUE.equals(enabled)) {
                              getWindow().addFlags(
                                      android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              );
                          } else {
                              getWindow().clearFlags(
                                      android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              );
                          }

                          result.success(true);
                          return;
                      }

                      if ("playDash".equals(call.method)) {
                          String url = call.argument("url");
                          String userAgent = call.argument("userAgent");
                          String channelName = call.argument("channelName");
                          String programTitle = call.argument("programTitle");
                          Long programStartMs = call.argument("programStartMs");
                          Long programEndMs = call.argument("programEndMs");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL DASH manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  DashPlayerActivity.class
                          );

                          intent.putExtra("url", url);
                          intent.putExtra("userAgent", userAgent);
                          intent.putExtra("channelName", channelName);
                          intent.putExtra("programTitle", programTitle);

                          if (programStartMs != null) {
                              intent.putExtra(
                                      "programStartMs",
                                      programStartMs.longValue()
                              );
                          }

                          if (programEndMs != null) {
                              intent.putExtra(
                                      "programEndMs",
                                      programEndMs.longValue()
                              );
                          }

                          startActivity(intent);
                          result.success(true);
                          return;
                      }

                      result.notImplemented();
                  });

                  radioChannel = new MethodChannel(
                          flutterEngine.getDartExecutor().getBinaryMessenger(),
                          RADIO_CHANNEL
                  );
                  radioChannel.setMethodCallHandler((call, result) -> {

                      if ("startBackgroundRadio".equals(call.method)) {
                          String url = call.argument("url");
                          String title = call.argument("title");

                          if (url == null || url.isEmpty()) {
                              result.error(
                                      "INVALID_URL",
                                      "URL audio manquante",
                                      null
                              );
                              return;
                          }

                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioPlaybackService.class
                          );

                          intent.setAction(
                                  RadioPlaybackService.ACTION_PLAY_RADIO
                          );
                          intent.putExtra(
                                  RadioPlaybackService.EXTRA_URL,
                                  url
                          );
                          intent.putExtra(
                                  RadioPlaybackService.EXTRA_TITLE,
                                  title == null ? "NGOMBI Radio" : title
                          );

                          ContextCompat.startForegroundService(
                                  MainActivity.this,
                                  intent
                          );

                          result.success(true);
                          return;
                      }

                      if ("stopBackgroundRadio".equals(call.method)) {
                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioPlaybackService.class
                          );

                          intent.setAction(
                                  RadioPlaybackService.ACTION_STOP_RADIO
                          );

                          startService(intent);
                          result.success(true);
                          return;
                      }

                      if ("startRadioNotification".equals(call.method)) {
                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioNotificationService.class
                          );
                          intent.setAction(RadioNotificationService.ACTION_START);
                          String title = call.argument("title");
                          intent.putExtra("title", title == null ? "Radio" : title);
                          ContextCompat.startForegroundService(MainActivity.this, intent);
                          result.success(true);
                          return;
                      }

                      if ("stopRadioNotification".equals(call.method)) {
                          Intent intent = new Intent(
                                  MainActivity.this,
                                  RadioNotificationService.class
                          );
                          intent.setAction(RadioNotificationService.ACTION_STOP);
                          startService(intent);
                          result.success(true);
                          return;
                      }

                      result.notImplemented();
                  });

                  if (!radioReceiverRegistered) {
                      ContextCompat.registerReceiver(
                              this,
                              radioControlReceiver,
                              new IntentFilter(RADIO_CONTROL_ACTION),
                              ContextCompat.RECEIVER_NOT_EXPORTED
                      );
                      radioReceiverRegistered = true;
                  }
              }

              @Override
              protected void onDestroy() {
                  if (radioReceiverRegistered) {
                      unregisterReceiver(radioControlReceiver);
                      radioReceiverRegistered = false;
                  }
                  super.onDestroy();
              }
          }
          EOF

          # Supprimer le MainActivity Kotlin généré par Flutter.
          rm -f "$KOTLIN_FILE"

          # ==================================================
          # DashPlayerActivity.java
          # ==================================================

          cat > "$JAVA_DIR/DashPlayerActivity.java" <<'EOF'
          package com.example.ngombi;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import androidx.annotation.Nullable;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class DashPlayerActivity extends Activity {

              private ExoPlayer player;
              private PlayerView playerView;
              private TextView errorText;
              private boolean initialLandscape;

              @Override
              protected void onCreate(
                      @Nullable Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  initialLandscape =
                          getResources().getConfiguration().orientation
                                  == Configuration.ORIENTATION_LANDSCAPE;

                  FrameLayout root = new FrameLayout(this);

                  playerView = new PlayerView(this);

                  root.addView(
                          playerView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  {
                      Button orientationButton = new Button(this);
                      orientationButton.setText(
                              initialLandscape ? "PORTRAIT" : "PAYSAGE"
                      );

                      orientationButton.setOnClickListener(
                              view -> {
                                  boolean landscape =
                                          getResources()
                                                  .getConfiguration()
                                                  .orientation
                                                  == Configuration.ORIENTATION_LANDSCAPE;

                                  setRequestedOrientation(
                                          landscape
                                                  ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                                                  : ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                                  );

                                  orientationButton.setText(
                                          landscape ? "PAYSAGE" : "PORTRAIT"
                                  );
                              }
                      );

                      FrameLayout.LayoutParams buttonParams =
                              new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              );
                      buttonParams.gravity =
                              android.view.Gravity.TOP |
                              android.view.Gravity.END;
                      buttonParams.topMargin = 18;
                      buttonParams.rightMargin = 18;

                      root.addView(
                              orientationButton,
                              buttonParams
                      );

                      TextView programText = new TextView(this);
                      String channelName =
                              getIntent().getStringExtra("channelName");
                      String programTitle =
                              getIntent().getStringExtra("programTitle");

                      String displayTitle =
                              channelName == null || channelName.isEmpty()
                                      ? "NGOMBI TV"
                                      : channelName;

                      if (programTitle != null &&
                              !programTitle.isEmpty()) {
                          displayTitle += "\n" + programTitle;
                      }

                      programText.setText(displayTitle);
                      programText.setTextColor(0xFFFFFFFF);
                      programText.setTextSize(15);
                      programText.setPadding(20, 12, 20, 12);
                      programText.setBackgroundColor(0x88000000);

                      FrameLayout.LayoutParams titleParams =
                              new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              );
                      titleParams.gravity =
                              android.view.Gravity.TOP |
                              android.view.Gravity.START;
                      titleParams.topMargin = 18;
                      titleParams.leftMargin = 18;

                      root.addView(
                              programText,
                              titleParams
                      );
                  }

                  errorText = new TextView(this);

                  errorText.setTextColor(0xFFFFFFFF);
                  errorText.setTextSize(15);
                  errorText.setPadding(40, 40, 40, 40);
                  errorText.setVisibility(TextView.GONE);

                  root.addView(
                          errorText,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  setContentView(root);

                  String url =
                          getIntent().getStringExtra("url");

                  String userAgent =
                          getIntent().getStringExtra("userAgent");

                  if (url == null || url.isEmpty()) {
                      showError("URL DASH manquante.");
                      return;
                  }

                  if (userAgent == null || userAgent.isEmpty()) {
                      userAgent = "Mozilla/5.0";
                  }

                  DefaultHttpDataSource.Factory
                          httpDataSourceFactory =
                          new DefaultHttpDataSource.Factory()
                                  .setUserAgent(userAgent);

                  /*
                   * Configuration Widevine officielle.
                   *
                   * NGOMBI ne contourne aucun DRM :
                   * Media3 utilise le mécanisme DRM Android
                   * prévu par le flux.
                   */
                  MediaItem.DrmConfiguration
                          drmConfiguration =
                          new MediaItem.DrmConfiguration.Builder(
                                  C.WIDEVINE_UUID
                          )
                                  .setMultiSession(true)
                                  .build();

                  MediaItem mediaItem =
                          new MediaItem.Builder()
                                  .setUri(url)
                                  .setMimeType("application/dash+xml")
                                  .setDrmConfiguration(
                                          drmConfiguration
                                  )
                                  .build();

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(
                                  new DefaultMediaSourceFactory(
                                          httpDataSourceFactory
                                  )
                          )
                          .build();

                  playerView.setPlayer(player);

                  player.addListener(
                          new Player.Listener() {

                              @Override
                              public void onPlayerError(
                                      PlaybackException error
                              ) {
                                  showError(
                                          "Erreur DRM / lecture :\n\n"
                                          + error.getErrorCodeName()
                                          + "\n\n"
                                          + error.getMessage()
                                  );
                              }
                          }
                  );

                  player.setMediaItem(mediaItem);

                  player.prepare();
                  player.play();
              }

              private void showError(String message) {
                  if (errorText != null) {
                      errorText.setText(message);
                      errorText.setVisibility(TextView.VISIBLE);
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();

                  if (player != null) {
                      player.pause();
                  }
              }

              @Override
              protected void onDestroy() {
                  setRequestedOrientation(
                          initialLandscape
                                  ? ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                                  : ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  );

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          # ==================================================
          # RadioPlaybackService.java
          # ==================================================

          cat > "$JAVA_DIR/RadioPlaybackService.java" <<'EOF'
          package com.example.ngombi;

          import android.content.Intent;

          import androidx.annotation.Nullable;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;

          @UnstableApi
          public class RadioPlaybackService extends MediaSessionService {

              public static final String ACTION_PLAY_RADIO =
                      "com.example.ngombi.action.PLAY_RADIO";

              public static final String ACTION_STOP_RADIO =
                      "com.example.ngombi.action.STOP_RADIO";

              public static final String EXTRA_URL =
                      "com.example.ngombi.extra.URL";

              public static final String EXTRA_TITLE =
                      "com.example.ngombi.extra.TITLE";

              private ExoPlayer player;
              private MediaSession mediaSession;

              @Override
              public void onCreate() {
                  super.onCreate();

                  AudioAttributes audioAttributes =
                          new AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(
                                          C.AUDIO_CONTENT_TYPE_MUSIC
                                  )
                                  .build();

                  player = new ExoPlayer.Builder(this).build();
                  player.setAudioAttributes(
                          audioAttributes,
                          true
                  );

                  mediaSession =
                          new MediaSession.Builder(
                                  this,
                                  player
                          ).build();
              }

              @Override
              public int onStartCommand(
                      @Nullable Intent intent,
                      int flags,
                      int startId
              ) {
                  if (intent != null) {
                      String action = intent.getAction();

                      if (ACTION_STOP_RADIO.equals(action)) {
                          player.stop();
                          player.clearMediaItems();
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      if (ACTION_PLAY_RADIO.equals(action)) {
                          String url =
                                  intent.getStringExtra(EXTRA_URL);

                          String title =
                                  intent.getStringExtra(EXTRA_TITLE);

                          if (url != null && !url.isEmpty()) {
                              MediaMetadata metadata =
                                      new MediaMetadata.Builder()
                                              .setTitle(
                                                      title == null ||
                                                              title.isEmpty()
                                                              ? "NGOMBI Radio"
                                                              : title
                                              )
                                              .setArtist("NGOMBI")
                                              .build();

                              MediaItem mediaItem =
                                      new MediaItem.Builder()
                                              .setUri(url)
                                              .setMediaMetadata(
                                                      metadata
                                              )
                                              .build();

                              player.setMediaItem(mediaItem);
                              player.prepare();
                              player.play();
                          }
                      }
                  }

                  return START_STICKY;
              }

              @Override
              public MediaSession onGetSession(
                      MediaSession.ControllerInfo controllerInfo
              ) {
                  return mediaSession;
              }

              @Override
              public void onDestroy() {
                  if (mediaSession != null) {
                      mediaSession.release();
                      mediaSession = null;
                  }

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          # ==================================================
          # RadioNotificationService.java
          # ==================================================

          cat > "$JAVA_DIR/RadioNotificationService.java" <<'EOF'
          package com.example.ngombi;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          import androidx.annotation.Nullable;
          import androidx.core.app.NotificationCompat;
          import androidx.media.session.MediaButtonReceiver;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;

          public class RadioNotificationService extends Service {
              public static final String ACTION_START = "com.example.ngombi.action.START_RADIO_NOTIFICATION";
              public static final String ACTION_STOP = "com.example.ngombi.action.STOP_RADIO_NOTIFICATION";
              private static final String ACTION_PAUSE = "com.example.ngombi.action.PAUSE";
              private static final String ACTION_PLAY = "com.example.ngombi.action.PLAY";
              private static final String ACTION_CONTROL = "com.example.ngombi.RADIO_CONTROL";
              private static final String CHANNEL_ID = "ngombi_radio_playback";
              private static final int NOTIFICATION_ID = 4205;
              private MediaSessionCompat session;
              private String stationTitle = "Radio";
              private boolean playing = true;

              @Override public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  session = new MediaSessionCompat(this, "NGOMBI Radio");
                  session.setFlags(MediaSessionCompat.FLAG_HANDLES_MEDIA_BUTTONS | MediaSessionCompat.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  session.setCallback(new MediaSessionCompat.Callback() {
                      @Override public void onPlay() { setPlaying(true); sendControl("play"); }
                      @Override public void onPause() { setPlaying(false); sendControl("pause"); }
                      @Override public void onStop() { setPlaying(false); sendControl("pause"); }
                  });
                  session.setActive(true);
              }

              @Override public int onStartCommand(@Nullable Intent intent, int flags, int startId) {
                  String action = intent == null ? ACTION_START : intent.getAction();
                  if (ACTION_STOP.equals(action)) {
                      if (session != null) { session.setActive(false); session.release(); session = null; }
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent != null && intent.hasExtra("title")) stationTitle = intent.getStringExtra("title");
                  if (ACTION_PAUSE.equals(action)) {
                      setPlaying(false);
                      sendControl("pause");
                  } else if (ACTION_PLAY.equals(action)) {
                      setPlaying(true);
                      sendControl("play");
                  } else {
                      setPlaying(true);
                  }
                  Notification notification = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(NOTIFICATION_ID, notification);
                  return START_STICKY;
              }

              private void setPlaying(boolean value) {
                  playing = value;
                  if (session == null) return;
                  session.setMetadata(new MediaMetadataCompat.Builder()
                          .putString(MediaMetadataCompat.METADATA_KEY_TITLE, stationTitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, "NGOMBI")
                          .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, "Radio en direct")
                          .build());
                  session.setPlaybackState(new PlaybackStateCompat.Builder()
                          .setActions(PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE | PlaybackStateCompat.ACTION_PLAY_PAUSE | PlaybackStateCompat.ACTION_STOP)
                          .setState(playing ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED, 0, playing ? 1f : 0f)
                          .build());
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (manager != null) manager.notify(NOTIFICATION_ID, buildNotification());
              }

              private void sendControl(String control) {
                  Intent intent = new Intent(ACTION_CONTROL).setPackage(getPackageName());
                  intent.putExtra("control", control);
                  sendBroadcast(intent);
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent content = PendingIntent.getActivity(this, 4206, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent toggle = PendingIntent.getService(this, 4207,
                          new Intent(this, RadioNotificationService.class).setAction(playing ? ACTION_PAUSE : ACTION_PLAY),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Action playPause = new NotificationCompat.Action(
                          playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                          playing ? "Pause" : "Lecture", toggle);
                  return new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("NGOMBI")
                          .setContentText(stationTitle + " · Radio en direct")
                          .setContentIntent(content)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(playing)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .addAction(playPause)
                          .setStyle(new androidx.media.app.NotificationCompat.MediaStyle()
                                  .setMediaSession(session.getSessionToken())
                                  .setShowActionsInCompactView(0))
                          .build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Lecture radio NGOMBI", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Affiche la radio NGOMBI en cours de lecture");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override public void onDestroy() {
                  if (session != null) { session.setActive(false); session.release(); session = null; }
                  super.onDestroy();
              }
              @Nullable @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # ==================================================
          # AndroidManifest.xml
          # ==================================================

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application',
                  1
              )

          if "android.permission.FOREGROUND_SERVICE" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n\n    <application',
                  1
              )

          if "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n\n    <application',
                  1
              )

          if "android.permission.ACCESS_NETWORK_STATE" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application',
                  1
              )

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          if "DashPlayerActivity" not in text:
              activity = (
                  '        <activity\n'
                  '            android:name=".DashPlayerActivity"\n'
                  '            android:configChanges="orientation|screenSize|keyboardHidden"\n'
                  '            android:exported="false" />\n\n'
              )

              text = text.replace(
                  "</application>",
                  activity + "</application>",
                  1
              )

          if "RadioNotificationService" not in text:
              notification_service = (
                  '        <service\n'
                  '            android:name=".RadioNotificationService"\n'
                  '            android:foregroundServiceType="mediaPlayback"\n'
                  '            android:exported="false" />\n\n'
              )
              text = text.replace("</application>", notification_service + "</application>", 1)

          if "RadioPlaybackService" not in text:
              service = (
                  '        <service\n'
                  '            android:name=".RadioPlaybackService"\n'
                  '            android:foregroundServiceType="mediaPlayback"\n'
                  '            android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="androidx.media3.session.MediaSessionService" />\n'
                  '                <action android:name="android.media.browse.MediaBrowserService" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n\n'
              )

              text = text.replace(
                  "</application>",
                  service + "</application>",
                  1
              )

          manifest.write_text(text)
          PY

          # ==================================================
          # app/build.gradle
          # ==================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # Compile SDK
          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          # Min SDK
          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = re.sub(
              r"minSdk\s*=\s*\d+",
              "minSdk = 23",
              text
          )

          # NDK
          text = re.sub(
              r"^\s*ndkVersion\s*=.*$",
              "",
              text,
              flags=re.MULTILINE
          )

          text = text.replace(
              "compileSdk = 36",
              'compileSdk = 36\n    ndkVersion = "27.0.12077973"',
              1
          )

          # Media3 dependencies
          if "androidx.media3:media3-exoplayer:1.11.1" not in text:
              dependencies = (
                  "\n"
                  "dependencies {\n"
                  '    implementation "androidx.media3:media3-exoplayer:1.11.1"\n'
                  '    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"\n'
                  '    implementation "androidx.media3:media3-ui:1.11.1"\n'
                  '    implementation "androidx.media3:media3-session:1.11.1"\n'
                  '    implementation "androidx.media:media:1.7.0"\n'
                  "}\n"
              )

              text += dependencies

          gradle.write_text(text)

          print("Android app configuration completed.")
          PY

      # --------------------------------------------------
