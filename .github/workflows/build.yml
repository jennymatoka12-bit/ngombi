name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Android project structure
        run: flutter create . --platforms android

      - name: Enable Internet Permission
        run: |
          chmod +x android/gradlew
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          permission = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n'
          if permission not in content:
              content = content.replace('<manifest', permission + '<manifest')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-project-arg android.compileSdkVersion=34 --android-project-arg android.minSdkVersion=23

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
