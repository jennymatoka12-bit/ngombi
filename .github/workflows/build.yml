name: Build & Release NGOMBI Direct APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Récupération du projet
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Installation de Java 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================================
      # 3. Installation de Flutter
      # ==========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true


      # ==========================================================
      # 4. Vérification de Flutter
      # ==========================================================
      - name: Flutter doctor
        run: flutter doctor -v


      # ==========================================================
      # 5. Nettoyage
      # ==========================================================
      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 6. Installation des dépendances
      # ==========================================================
      - name: Get dependencies
        run: flutter pub get


      # ==========================================================
      # 7. Vérification du projet
      # ==========================================================
      - name: Flutter analyze
        run: flutter analyze


      # ==========================================================
      # 8. Construction de l'APK Release
      # ==========================================================
      - name: Build APK Release
        run: flutter build apk --release


      # ==========================================================
      # 9. Vérification de l'APK
      # ==========================================================
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk


      # ==========================================================
      # 10. Publication de l'APK
      # ==========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
