name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-testflight

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build NGOMBI for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout iOS development branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the iOS platform scaffold if missing
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.ngombi .
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Add build information
        run: |
          cat > build/ios/iphonesimulator/BUILD-INFO.txt <<'EOF'
          NGOMBI - iOS Simulator build
          Type: unsigned simulator application (.app)
          Device: iOS Simulator only
          Physical iPhone installation: not supported
          This artifact is not an IPA and is not signed for device installation.
          EOF

      # Upload the .app directory directly. GitHub creates the single ZIP
      # download archive, avoiding the previous nested ZIP inside a ZIP.
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ngombi-ios-simulator-app
          path: |
            build/ios/iphonesimulator/Runner.app
            build/ios/iphonesimulator/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
