name: ngombi_app
description: "Application NGOMBI - TV & Radio en direct"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0

  # Packages requis par lib/main.dart (Version fixée pour Flutter 3.22+)
  youtube_player_flutter: ^9.1.1
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
