name: ngombi
description: "NGOMBI - TV & Radio Direct"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  video_player: ^2.9.1
  http: ^1.2.2
  xml: ^6.5.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.9.1
  wakelock_plus: 1.2.11
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tvradiozap.txt
    - assets/ngombi_icon.png
    - assets/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/ngombi_icon.png"
  adaptive_icon_background: "#080808"
  min_sdk_android: 23

dependency_overrides:
  # 2.12.2+ switched the AVFoundation native player to Swift and the
  # current hosted Xcode toolchain fails in AVFactory.swift (isolation arg).
  # Keep the last Objective-C implementation until upstream compatibility is verified.
  video_player_avfoundation: 2.12.1
