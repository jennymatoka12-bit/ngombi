name: ngombi
description: "NGOMBI - TV & Radio Direct"
publish_to: "none"
version: 2.0.0+20

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  video_player: ^2.9.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tvradiozap.txt
    - assets/ngombi_icon.png
    - assets/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/ngombi_icon.png"
  adaptive_icon_background: "#080808"
  windows:
    generate: true
    image_path: "assets/ngombi_icon.png"
    icon_size: 256
  min_sdk_android: 23
