name: ngombi
description: "NGOMBI - TV & Radio Direct"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  # Vendored WebView2 texture plugin; Windows-only implementation keeps Android runtime dependencies unchanged.
  webview_windows:
    path: packages/webview_windows
  video_player: ^2.9.1
  # Windows fallback engine for streams that fail in MediaKit.
  vlc_player: ^1.0.0
  wakelock_plus: ^1.2.8
  window_manager: ^0.4.3
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: ^1.0.11
  http: ^1.2.2
  xml: ^6.5.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tvradiozap.txt
    - assets/ngombi_icon.png
    - assets/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/ngombi_icon.png"
  adaptive_icon_background: "#080808"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/ngombi_icon.png"
    icon_size: 48
