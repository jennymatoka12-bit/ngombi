name: ngombi
description: "NGOMBI - TV & Radio Direct"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tvradiozap.txt
    - assets/ngombi_icon.png
    
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/ngombi_icon.png"
  adaptive_icon_background: "#080808"
  min_sdk_android: 23
