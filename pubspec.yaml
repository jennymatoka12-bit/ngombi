name: ngombi_direct
description: "Application de streaming TV et Radio en direct - NGOMBI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Lecteur YouTube natif (Résolution des erreurs 153, 150, 400)
  youtube_player_flutter: ^9.0.1
  
  # Lecteur Audio performant pour flux HTTP / HTTPS / HLS
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # Sauvegarde locale des favoris
  shared_preferences: ^2.2.2
  
  # Gestion de l'ouverture des liens externes (Fallback / Secours)
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Générateur d'icône d'application pour Android et iOS
  flutter_launcher_icons: ^0.13.1

# Configuration de l'icône de l'application
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  # Déclaration du dossier des ressources graphiques
  assets:
    - assets/icon/
